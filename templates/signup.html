<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg w-96">
        <h1 class="text-2xl font-bold mb-6">Sign Up</h1>
        <form action="/signup" method="POST">
            <input type="text" name="name" placeholder="Username" class="w-full p-3 rounded bg-gray-700 mb-4">
            <input type="email" name="email" placeholder="Email" class="w-full p-3 rounded bg-gray-700 mb-4">
            <input type="password" name="password" placeholder="Password" class="w-full p-3 rounded bg-gray-700 mb-4">
            <button type="submit" class="w-full bg-blue-600 p-3 rounded font-bold">Sign Up</button>
        </form>
        <p class="mt-4 text-center">Already have an account? <a href="/login" class="text-blue-400">Login</a></p>
    </div>
</html>
