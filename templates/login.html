<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg w-96">
        <h1 class="text-2xl font-bold mb-6">Login</h1>
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Email" class="w-full p-3 rounded bg-gray-700 mb-4">
            <input type="password" name="password" placeholder="Password" class="w-full p-3 rounded bg-gray-700 mb-4">
            {% if error %}
                  <p class="text-red-500 text-center mt-3 mb-3">{{ error }}</p>
            {% endif %}
            <button type="submit" class="w-full bg-blue-600 p-3 mt-3 rounded font-bold">Login</button>
        </form>
        <p class="mt-4 text-center">No account? <a href="/signup" class="text-blue-400">Sign up</a></p>
    </div>
    
</body>
</html>
